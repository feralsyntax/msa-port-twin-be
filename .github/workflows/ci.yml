name: Backend CI

on:
  pull_request:
    branches:
        - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and migration checks
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: port_twin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d port_twin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MODE: test
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/port_twin_test
      MARINE_AI_BACKEND: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
    
      - name: Install geospatial system dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Install CPU-only PyTorch
        run: |
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.14.1

      - name: Run lint checks
        run: |
          ruff check port_twin_app port_twin_proj scripts \
            --select E4,E7,E9,F

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test