openapi: 3.0.3
info:
  title: MSA Port Twin API
  version: 1.0.0
  description: API for port operations, vessel queueing, marine conditions, and AI-powered
    simulations.
paths:
  /api/v1/berths/:
    get:
      operationId: berths_list
      description: Retrieve a paginated list of berths.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - berths
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBerthList'
          description: ''
    post:
      operationId: berths_create
      description: Create a new berth.
      tags:
      - berths
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BerthCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BerthCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BerthCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Berth'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/berths/{id}/:
    get:
      operationId: berths_retrieve
      description: Retrieve details of a single berth identified by its UUID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - berths
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Berth'
          description: ''
  /api/v1/data-status/:
    get:
      operationId: data_status_retrieve
      description: Returns marine data provenance, ingestion timestamps, vessel position
        freshness, and marine AI configuration status.
      tags:
      - data-status
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStatus'
          description: ''
  /api/v1/marine-conditions/:
    get:
      operationId: marine_conditions_list
      description: Retrieve all marine-condition records and records filtered by source.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: source
        schema:
          enum:
          - observed
          - ai_prediction
          - external
          - demo
          type: string
          minLength: 1
        description: |-
          * `observed` - Observed
          * `ai_prediction` - AI Prediction
          * `external` - External Data Source
          * `demo` - Demonstration Data
      tags:
      - marine-conditions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarineConditionList'
          description: ''
  /api/v1/marine-predictions/:
    get:
      operationId: marine_predictions_list
      description: List stored marine forecasts.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - marine-predictions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarinePredictionList'
          description: ''
  /api/v1/marine-predictions/{id}/:
    get:
      operationId: marine_predictions_retrieve
      description: Retrieve a previously stored marine forecast.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marine-predictions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarinePrediction'
          description: ''
  /api/v1/marine-predictions/create/:
    post:
      operationId: marine_predictions_create_create
      description: Generate and store a new forecast.
      tags:
      - marine-predictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarinePredictionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarinePredictionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarinePredictionRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarinePrediction'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/overview/:
    get:
      operationId: overview_retrieve
      description: Return a consolidated overview of port operations.
      tags:
      - overview
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsOverview'
          description: ''
  /api/v1/scenarios/:
    get:
      operationId: scenarios_list
      description: List saved scenarios or create a new scenario.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - scenarios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScenarioResponseList'
          description: ''
    post:
      operationId: scenarios_create
      description: List saved scenarios or create a new scenario.
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/scenarios/{id}/:
    get:
      operationId: scenarios_retrieve
      description: Retrieve or update a scenario identified by its UUID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scenarios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
          description: ''
    put:
      operationId: scenarios_update
      description: Retrieve or update a scenario identified by its UUID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScenarioCreateUpdateRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
    patch:
      operationId: scenarios_partial_update
      description: Retrieve or update a scenario identified by its UUID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scenarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedScenarioCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedScenarioCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedScenarioCreateUpdateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/scenarios/{id}/simulations/:
    post:
      operationId: scenarios_simulations_create
      description: Queue a simulation for a saved scenario.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scenarios
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSimulationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationErrorResponse'
          description: ''
  /api/v1/simulations/:
    get:
      operationId: simulations_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - simulations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSimulationHistoryItemList'
          description: ''
  /api/v1/simulations/{id}/:
    get:
      operationId: simulations_retrieve
      description: Retrieve a simulation run and its persisted results.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - simulations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationDetailResponse'
          description: ''
  /api/v1/simulations/compare/:
    get:
      operationId: simulations_compare_retrieve
      parameters:
      - in: query
        name: run_a
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: run_b
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - simulations
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationComparisonResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/vessel-positions/:
    get:
      operationId: vessel_positions_list
      description: Retrieve either all vessel positions or the position of one vessel
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: vessel
        schema:
          type: string
          format: uuid
      tags:
      - vessel-positions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVesselPositionList'
          description: ''
  /api/v1/vessels/:
    get:
      operationId: vessels_list
      description: Retrieve a paginated list of registered vessels.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      tags:
      - vessels
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVesselResponseList'
          description: ''
    post:
      operationId: vessels_create
      description: Register a new vessel.
      tags:
      - vessels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VesselCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VesselCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: ''
  /api/v1/vessels/{id}/:
    get:
      operationId: vessels_retrieve
      description: Retrieve details of a registered vessel.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vessels
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselResponse'
          description: ''
  /api/v1/vessels/{vessel_id}/positions/:
    get:
      operationId: vessels_positions_list
      description: Retrieve the position history of a specific vessel.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: vessel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - vessels
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVesselPositionList'
          description: ''
components:
  schemas:
    AIModelStatus:
      type: object
      properties:
        backend:
          type: string
        configured:
          type: boolean
        readiness:
          type: string
        configured_model_version:
          type: string
        latest_prediction_status:
          type: string
          nullable: true
        latest_prediction_model_version:
          type: string
          nullable: true
        latest_prediction_contract_version:
          type: string
          nullable: true
        latest_prediction_at:
          type: string
          format: date-time
          nullable: true
      required:
      - backend
      - configured
      - configured_model_version
      - latest_prediction_at
      - latest_prediction_contract_version
      - latest_prediction_model_version
      - latest_prediction_status
      - readiness
    APIErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required:
      - code
      - details
      - message
    APIErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/APIErrorDetail'
      required:
      - error
    AssignedVessel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        imo_number:
          type: string
          readOnly: true
          nullable: true
        mmsi:
          type: string
          readOnly: true
          nullable: true
        vessel_type:
          allOf:
          - $ref: '#/components/schemas/VesselTypeEnum'
          readOnly: true
      required:
      - id
      - imo_number
      - mmsi
      - name
      - vessel_type
    Berth:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        longitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        latitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        max_vessel_length:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Maximum vessel length in metres.
        max_vessel_draft:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Maximum permitted vessel draft in metres.
        status:
          allOf:
          - $ref: '#/components/schemas/BerthOperationalStatusEnum'
          readOnly: true
        is_occupied:
          type: boolean
          readOnly: true
        assigned_vessel:
          allOf:
          - $ref: '#/components/schemas/AssignedVessel'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_vessel
      - created_at
      - id
      - is_occupied
      - latitude
      - longitude
      - max_vessel_draft
      - max_vessel_length
      - name
      - status
      - updated_at
    BerthCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        max_vessel_length:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_vessel_draft:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/BerthOperationalStatusEnum'
      required:
      - latitude
      - longitude
      - max_vessel_length
      - name
    BerthOperationalStatusEnum:
      enum:
      - active
      - inactive
      - maintenance
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `maintenance` - Under Maintenance
    DataSourceCount:
      type: object
      properties:
        source:
          type: string
        count:
          type: integer
      required:
      - count
      - source
    DataStatus:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        marine_conditions:
          $ref: '#/components/schemas/MarineDataProvenance'
        vessel_positions:
          $ref: '#/components/schemas/VesselPositionDataStatus'
        ai:
          $ref: '#/components/schemas/AIModelStatus'
      required:
      - ai
      - generated_at
      - marine_conditions
      - vessel_positions
    MarineCondition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          description: Time the conditions apply to or were observed.
        water_level:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: Water level relative to a documented reference datum, in metres.
        current_speed:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: Current speed in metres per second.
        current_direction:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Current direction in degrees.
        wind_speed:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Wind speed in metres per second.
        source:
          allOf:
          - $ref: '#/components/schemas/MarineConditionDataSourceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_direction
      - current_speed
      - id
      - latitude
      - longitude
      - recorded_at
      - source
      - water_level
      - wind_speed
    MarineConditionDataSourceEnum:
      enum:
      - observed
      - ai_prediction
      - external
      - demo
      type: string
      description: |-
        * `observed` - Observed
        * `ai_prediction` - AI Prediction
        * `external` - External Data Source
        * `demo` - Demonstration Data
    MarineDataProvenance:
      type: object
      properties:
        total_records:
          type: integer
        source_counts:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceCount'
        latest_recorded_at:
          type: string
          format: date-time
          nullable: true
        latest_ingested_at:
          type: string
          format: date-time
          nullable: true
      required:
      - latest_ingested_at
      - latest_recorded_at
      - source_counts
      - total_records
    MarineForecastInput:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
      required:
      - start_time
    MarineGridInput:
      type: object
      properties:
        west:
          type: number
          format: double
        south:
          type: number
          format: double
        east:
          type: number
          format: double
        north:
          type: number
          format: double
        nx:
          type: integer
          minimum: 2
        ny:
          type: integer
          minimum: 2
        crs:
          type: string
          default: EPSG:4326
      required:
      - east
      - north
      - nx
      - ny
      - south
      - west
    MarinePrediction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grid:
          readOnly: true
          description: Geographic bounds, resolution, and CRS.
        forecast:
          readOnly: true
          description: Forecast start time, steps, and time interval.
        input_data:
          readOnly: true
          description: Inputs used to generate the prediction.
        result_data:
          readOnly: true
          nullable: true
          description: Predicted water levels and current components.
        model_version:
          type: string
          readOnly: true
        contract_version:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MarinePredictionStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contract_version
      - created_at
      - error_message
      - forecast
      - grid
      - id
      - input_data
      - model_version
      - result_data
      - status
    MarinePredictionRequest:
      type: object
      properties:
        grid:
          $ref: '#/components/schemas/MarineGridInput'
        forecast:
          $ref: '#/components/schemas/MarineForecastInput'
        bathymetry_m: {}
        initial_water_level_m: {}
        initial_current_u_ms: {}
        initial_current_v_ms: {}
      required:
      - bathymetry_m
      - forecast
      - grid
      - initial_current_u_ms
      - initial_current_v_ms
      - initial_water_level_m
    MarinePredictionStatusEnum:
      enum:
      - completed
      - failed
      type: string
      description: |-
        * `completed` - Completed
        * `failed` - Failed
    OperationsBerthOverview:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        maintenance:
          type: integer
      required:
      - active
      - inactive
      - maintenance
      - total
    OperationsDataStatus:
      type: object
