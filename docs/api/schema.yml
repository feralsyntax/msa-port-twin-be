      type: object
      properties:
        vessels:
          type: array
          items:
            $ref: '#/components/schemas/VesselSimulationResult'
      required:
      - vessels
    VesselSimulationResult:
      type: object
      properties:
        vessel_id:
          type: string
        arrival_hour:
          type: number
          format: double
        berth_id:
          type: string
          nullable: true
        service_start_hour:
          type: number
          format: double
          nullable: true
        departure_hour:
          type: number
          format: double
          nullable: true
        waiting_hours:
          type: number
          format: double
          nullable: true
        status:
          type: string
        reason:
          type: string
          nullable: true
      required:
      - arrival_hour
      - berth_id
      - departure_hour
      - service_start_hour
      - status
      - vessel_id
      - waiting_hours
    VesselTypeEnum:
      enum:
      - container
      - tanker
      - bulk_carrier
      - general_cargo
      - passenger
      - other
      - unknown
      type: string
      description: |-
        * `container` - Container Ship
        * `tanker` - Tanker
        * `bulk_carrier` - Bulk Carrier
        * `general_cargo` - General Cargo
        * `passenger` - Passenger
        * `other` - Other
        * `unknown` - Unknown
