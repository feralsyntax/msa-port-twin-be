      - vessels_in_service
      - vessels_served
      - vessels_waiting
    SourceEnum:
      enum:
      - observed
      - ai_prediction
      - external
      - demo
      type: string
      description: |-
        * `observed` - Observed
        * `ai_prediction` - AI Prediction
        * `external` - External Data Source
        * `demo` - Demonstration Data
    Vessel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        imo_number:
          type: string
          nullable: true
          maxLength: 12
        mmsi:
          type: string
          nullable: true
          maxLength: 9
        vessel_type:
          $ref: '#/components/schemas/VesselTypeEnum'
        length_overall:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Vessel length in metres.
        width:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Vessel width in metres.
        draft:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Vessel draft in metres.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    VesselPosition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vessel:
          type: string
          format: uuid
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
        speed_over_ground:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Vessel speed in knots.
        course_over_ground:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Vessel course in degrees.
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course_over_ground
      - created_at
      - id
      - latitude
      - longitude
      - recorded_at
      - speed_over_ground
      - vessel
    VesselPositionDataStatus:
      type: object
      properties:
        total_records:
          type: integer
        latest_recorded_at:
          type: string
          format: date-time
          nullable: true
        latest_ingested_at:
          type: string
          format: date-time
          nullable: true
      required:
      - latest_ingested_at
      - latest_recorded_at
      - total_records
