        name:
          type: string
          maxLength: 200
        description:
          type: string
        parameters:
          description: Configuration values used by the simulation.
        status:
          $ref: '#/components/schemas/ScenarioStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Scenario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        parameters:
          description: Configuration values used by the simulation.
        status:
          $ref: '#/components/schemas/ScenarioStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
